<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дипломный практикум в Яндекс Облаке</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f0f4f8;
            color: #333;
        }
        h1 {
            color: #003366;
            margin-bottom: 10px;
            font-size: 2.2em;
        }
        p {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 30px;
        }
        .avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }
        .avatar:hover {
            transform: scale(1.05);
        }
        .footer {
            margin-top: 50px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>Дипломный практикум успешно выполнен</h1>
    <p>Kubernetes кластер работает, мониторинг настроен, CI/CD активен.</p>
    
    <img src="https://avatars.mds.yandex.net/get-yapic/18057972/aYWfWGkXoe3zUZCKMWhNMpq7HrQ-1/islands-200" alt="Аватар" class="avatar">
    
    <div class="footer">
        Развернуто с помощью Terraform, Ansible и GitHub Actions
    </div>
</body>
</html>
