apiVersion: apps/v1
kind: Deployment
metadata:
  name: diploma-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diploma-app
  template:
    metadata:
      labels:
        app: diploma-app
    spec:
      imagePullSecrets:
      - name: yc-registry-secret
      containers:
      - name: app
        image: cr.yandex/crp4r0nq5ai4a1bjoq3m/diploma-app:v1.0.0
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: diploma-app
  namespace: default
spec:
  selector:
    app: diploma-app
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /app
        pathType: Prefix
        backend:
          service:
            name: diploma-app
            port:
              number: 80
